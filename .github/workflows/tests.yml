name: MNH Calendar checks

on:
  pull_request:
    branches: [main, development-hardening-phase-1]
  push:
    branches: [main, development-hardening-phase-1, 'feature/**']

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt pytest httpx2
      - name: Check Class Rep JavaScript syntax
        run: |
          node --check frontend/js/class-rep.js
          node --check frontend/js/class-rep-renderer.js
      - name: Test Class Rep Assistant modules
        run: python -m pytest -q backend/tests/test_class_rep_assistant.py tests/test_class_rep_ui.py
      - name: Run full regression suite
        run: python -m pytest -q
