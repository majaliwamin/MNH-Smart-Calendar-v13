[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mnh-calendar-backend"
version = "2.0.0"
description = "Shared MNH academic calendar API"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "numpy>=2.1,<3",
    "scipy>=1.14,<2",
    "pandas>=2.2,<3",
    "sympy>=1.13,<2",
    "statsmodels>=0.14,<1",
    "scikit-learn>=1.5,<2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
