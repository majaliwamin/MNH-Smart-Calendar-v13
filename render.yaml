services:
  - type: web
    name: mnh-calendar
    runtime: python
    plan: starter
    region: frankfurt
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health/ready
    autoDeploy: true
    disk:
      name: mnh-calendar-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: MNH_DATA_DIR
        value: /var/data
      - key: MNH_ENV
        value: production
      - key: MNH_ADMIN_PASSWORD
        sync: false
      - key: MNH_LECTURER_PASSWORD
        sync: false
      - key: MNH_HOD_PASSWORD
        sync: false
      - key: MNH_COORDINATOR_PASSWORD
        sync: false
      - key: MNH_ED_PASSWORD
        sync: false
      - key: PYTHON_VERSION
        value: 3.12.8
