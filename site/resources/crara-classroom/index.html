(function(){
 "use strict";
 var nativeFetch=window.fetch.bind(window);
 var MESSAGE="Read-only version — online classroom features need the backend. Offline slides still work.";
 function reply(payload,status){
  return Promise.resolve(new Response(JSON.stringify(payload),{status:status||200,headers:{"Content-Type":"application/json; charset=utf-8"}}));
 }
 window.fetch=function(input,init){
  var url=typeof input==="string"?input:input&&input.url?input.url:String(input);
  if(url.indexOf("/api/")===-1)return nativeFetch(input,init);
  var path=url.split("?")[0];
  if(path.indexOf("/api/class-rep/livekit/handoff")!==-1)return reply({detail:MESSAGE});
  var method=String((init&&init.method)||(input&&input.method)||"GET").toUpperCase();
  if(method!=="GET"&&method!=="HEAD")return reply({ok:true,readOnly:true,message:MESSAGE});
  return reply({ok:true,configured:false,items:[],values:{},static:true});
 };
})();
